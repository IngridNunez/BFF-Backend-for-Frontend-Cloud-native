services:
  app:
    build: .
    container_name: bff
    restart: unless-stopped
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sanos-y-salvos-network
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: ${SPRING_CONFIG_IMPORT:-optional:configserver:http://config-server:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://discovery-server:8761/eureka/}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      # En producción (detrás de API Gateway/ALB el bff no ve el https) poner BFF_COOKIES_SECURE=true
      # para que las cookies de sesión salgan con el atributo Secure. En local (http) queda en false.
      BFF_COOKIES_SECURE: ${BFF_COOKIES_SECURE:-false}
      # Chat: el WebSocket va directo a ms-chat con un ticket que firma el bff. El secreto debe ser
      # el mismo que usa ms-chat (min. 32 caracteres); sin él POST /api/v1/chat/ticket responde 503.
      CHAT_TICKET_SECRET: ${CHAT_TICKET_SECRET:-}
      CHAT_WS_URL: ${CHAT_WS_URL:-ws://localhost:8084/api/v1/ws/chat}

networks:
  sanos-y-salvos-network:
    # la crea config-server (external: false ahí); acá solo nos unimos, igual que discovery-server
    external: true
    name: sanos-y-salvos-network
