spring:
  application:
    name: bff #nombre con que mi bff se comunica con eruka
  config:
    import: optional:configserver:http://localhost:8888 #opcional por ahora el config server

server:
  port: 8081 #puerto del bff

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ #url del eureka

servicios: #configuración de los servicios
  rutas:
    mascotas: ms-mascotas #ruta/mascotas ->nombre en eureka
    alertas: ms-notificaciones #ruta/alertas ->nombre en eureka




bff:
  retry-after: 5 #tiempo de espera para reintentar la solicitud