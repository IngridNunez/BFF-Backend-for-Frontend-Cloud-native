spring:
  application:
    name: bff
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://example-test-issuer.invalid/.well-known/jwks.json
          issuer-uri: https://example-test-issuer.invalid

server:
  port: 0

eureka:
  client:
    enabled: false

servicios:
  rutas:
    mascotas: ms-mascotas
    alertas: ms-alertas
    usuarios: ms-usuarios

bff:
  retry-after: 5

cognito:
  region: us-east-1
  user-pool-id: test-pool
  client-id: test-client
